# cargo-deny configuration — bloch-l2-evm (SCAFFOLD, testnet / zero-value).
# Run locally with:  cargo deny check bans sources advisories licenses
# The determinism contract (design §1) wants ONE resolution of the revm tree
# with no native backends the SP1 guest cannot build; this file enforces the
# parts a manifest cannot (duplicate versions, C/asm crates, sources).

[graph]
all-features = true

[advisories]
version = 2
# Kept in step with .cargo/audit.toml (same justifications there).
ignore = [
    "RUSTSEC-2025-0055", # tracing-subscriber 0.2.x: lockfile-only, never compiled
    "RUSTSEC-2024-0388", # derivative: unmaintained, lockfile-only, never compiled
    "RUSTSEC-2024-0436", # paste: unmaintained proc-macro of the alloy tree
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "MPL-2.0",
    "0BSD",
]
unused-allowed-license = "allow"

[bans]
# A second version of any crate is a second implementation in the program;
# the lockfile must resolve to one. (revm's tree currently carries some
# duplicates: they are reported so a bump can retire them, not silently kept.)
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# Native (C / assembly) backends the guest cannot build and that turn the
# "byte-identical re-execution" argument into a per-platform one. `c-kzg` /
# `blst` are still required for the Cancun point-evaluation precompile until a
# pure-Rust backend (`kzg-rs`) replaces them — see Cargo.toml.
deny = [
    { crate = "secp256k1", reason = "libsecp256k1 (C): ecrecover uses the pure-Rust k256 instead" },
    { crate = "secp256k1-sys", reason = "libsecp256k1 (C)" },
    { crate = "sha3-asm", reason = "assembly keccak backend; the portable one is used" },
    { crate = "keccak-asm", reason = "assembly keccak backend; the portable one is used" },
    { crate = "openssl", reason = "no TLS / native crypto in the STF" },
    { crate = "openssl-sys", reason = "no TLS / native crypto in the STF" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
