# bloch-l2-evm — SCAFFOLD, UNAUDITED, not a working L2.
#
# Execution-layer state-transition core for the Bloch EVM L2 (design document
# `docs/specs/BLOCH-L2-EVM-DESIGN.md` §1, in the upstream monorepo — not in this
# repository): UNMODIFIED revm at SpecId::CANCUN over an in-memory revm state
# layer with a committed supply ledger and head record, deposit mints (bridged
# BLCH only, zero issuance), vault fee routing (the protocol never burns), header
# validation, committed block hashes, the EIP-4788 system call, an incremental
# keccak-MPT state root and the stateless proving primitives (witness
# generation + guest verification).
#
# This is NOT a Reth node, NOT a sequencer, NOT a prover. The eth_* RPC, the
# txpool, the Reth-SDK node embedding and the SP1 guest build target are honest
# labelled stubs (src/stubs.rs). Internal audit and status: AUDITORIA-L2.md.
#
# Standalone-workspace pattern: its own empty [workspace] table so it builds
# outside the product root workspace and carries the revm tree independently.
[package]
name = "bloch-l2-evm"
version = "0.0.0-scaffold"
edition = "2021"
# Alloy consensus 2.2.0 requires rustc >= 1.94.1; the exact compiler is pinned in
# rust-toolchain.toml (determinism contract: node and guest re-execute
# the same kernel source, so the toolchain is part of the program identity).
rust-version = "1.94.1"
license = "MIT OR Apache-2.0"
publish = false
description = "SCAFFOLD, UNAUDITED, not a working L2. Execution-layer state-transition core for the Bloch EVM L2: unmodified revm pinned at CANCUN, bridged-BLCH deposit mints (zero issuance), vault fee routing (the protocol never burns; EIP-6780 burns are accounted), committed ledger/head record, incremental keccak-MPT state root, stateless proving primitives. Testnet / zero-value posture."

# Deliberately empty: this crate is its own workspace root, excluded from
# the product root workspace.
[workspace]

# Every consensus-relevant crate is an EXACT pin (`=`), matching the committed
# Cargo.lock: the design rule is that the node and the future SP1 guest
# execute the same kernel source, and a manifest of caret ranges would let a
# separate guest crate resolve to different versions. Any bump is a documented
# program upgrade (and a new SP1 vkey). `default-features = false` everywhere:
# the feature set is chosen here, explicitly, because it determines the code
# that is compiled.
[dependencies]
# Genesis-4 header and body commitments use SHA3-256, not EVM Keccak.
sha3 = { version = "=0.11.0", default-features = false }
# revm — the EVM. `host-kzg` below selects portable c-kzg by default.
# Without it, revm 41 keeps Cancun's 0x0a precompile and uses its pure-Rust
# arkworks verifier (there is no `kzg-rs` feature in this release). Do not
# enable revm's defaults: they also select C crypto backends. Ecrecover uses
# pure-Rust k256. See docs/KZG-BACKENDS.md for guest feature isolation.
revm = { version = "=41.0.0", default-features = false }
# Address/U256/B256: one type family across the crate (revm 41 uses 1.6.x).
alloy-primitives = { version = "=1.6.1", default-features = false }
# keccak-256 hexary Merkle-Patricia trie node encoders / HashBuilder / proofs
# and RLP for account and slot values. Pure Rust, no_std-capable.
alloy-trie = { version = "=0.9.5", default-features = false }
alloy-rlp = { version = "=0.3.16", default-features = false }
# Canonical signed Ethereum envelopes and pure-Rust secp256k1 recovery. This
# authorization exists only in the L2 repository; native Bloch L1 stays PQ-only.
alloy-consensus = { version = "=2.2.0", default-features = false, features = ["k256"] }
alloy-eips = { version = "=2.2.0", default-features = false }
# The U256 implementation behind alloy-primitives/revm: pinned here so the
# manifest, not only the lockfile, fixes it. 1.20.0 is a documented program
# upgrade over the audited 1.19.0 (RUSTSEC-2026-0220: wrong overflow flags in
# `overflowing_shl/shr` and truncated shift amounts >= 2^32; revm bounds every
# EVM shift to < 256 and this crate only shifts by constants, so no executed
# semantics changed — verified by the full test matrix).
ruint = { version = "=1.20.0", default-features = false }
# Optional: state snapshots and the host→guest witness wire format.
serde = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }

[dev-dependencies]
# Round-trip tests of the serde wire format (already in the lockfile via revm).
serde_json = "=1.0.151"
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa"] }

[features]
# CANDIDATE, inert: the sparse settlement witness (`src/sparse_witness.rs`). No release
# enables it, and without it no program built from this crate changes by a byte.
sparse-witness = ["serde", "forced-inclusion"]
# CANDIDATE, inert: L1 forced inclusion (`src/forced_inclusion.rs`, a `ChainSpec`
# field and configuration tag 4 on the next rules). Without it no program built
# from this crate changes by a byte.
forced-inclusion = []
# Local transition kernel only; no mainnet bridge or proof verifier.
experimental-escrow = []
default = ["std", "host-kzg"]
# Native host acceleration; omit for the guest's pure-Rust arkworks backend.
host-kzg = ["revm/c-kzg", "revm/portable"]
# Host build. Without it the crate — and the whole revm/alloy tree — is
# `no_std` + `alloc`, the shape an SP1 guest requires
# (`cargo test --no-default-features` exercises it).
std = ["revm/std", "alloy-primitives/std", "alloy-trie/std", "alloy-rlp/std", "alloy-consensus/std", "alloy-eips/std", "serde?/std"]
# Serialize/deserialize `L2State` (snapshots) and `BatchWitness` /
# `WitnessAccount` (the host→guest wire format, round-trip tested).
serde = ["dep:serde", "revm/serde", "alloy-primitives/serde", "alloy-trie/serde"]

[[example]]
name = "native_escrow"
required-features = ["experimental-escrow"]

[[example]]
name = "bloch-genesis-identity"
path = "examples/bloch-genesis-identity.rs"
required-features = ["serde"]
