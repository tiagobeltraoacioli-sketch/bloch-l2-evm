# Format of the PRIVATE denylist read by publish_check.py. Install the real one at
# ~/.config/bloch-publish-safety/denylist.conf (mode 0600). Never commit real values.
# Patterns are case-insensitive and must stay in the subset that Python `re` and `git grep -E`
# read the same way: literals, \. [..] ( | ) ^ $ ? * + {m,n}. No (?, \b, \s, \d or \w.
[rule6]
example confidential phrase
[deployer]
0x0000000000000000000000000000000000000000
[retired-address]
0x0000000000000000000000000000000000000000
[internal-ip]
192.0.2.10
[key-path]
example-key-folder
[identity]
someone@example\.invalid
