[package]
name = "bloch-execution-artifact"
version = "0.1.0-experimental"
edition = "2021"
rust-version = "1.94.1"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[dependencies]
bloch-l2-evm = { path = "../..", default-features = false, features = ["std", "serde", "sparse-witness", "forced-complete"] }
alloy-primitives = { version = "=1.6.1", default-features = false, features = ["serde"] }
alloy-rlp = "=0.3.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
