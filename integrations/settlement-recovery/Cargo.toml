[package]
name = "bloch-settlement-recovery"
version = "0.1.0-experimental"
edition = "2021"
rust-version = "1.98.1"
license = "AGPL-3.0-or-later"
publish = false
description = "Read-only composition of PQ authority recovery and canonical L2 settlement correspondence"

# The combined host adapter stays outside both portable and Reth workspaces.
[workspace]

[[bin]]
name = "bloch-l2-audit-dev"
path = "src/bin/bloch-l2-audit-dev.rs"

[[bin]]
name = "bloch-l2-produce-dev"
path = "src/bin/bloch-l2-produce-dev.rs"

[[bin]]
name = "bloch-l2-native-follower"
path = "src/bin/bloch-l2-native-follower.rs"

[features]
# Development networks whose native consensus arms RANDAO re-commits from genesis.
devnet-randao-recommit = ["bloch-pos-committee/devnet-randao-recommit", "bloch-pos-node/devnet-randao-recommit"]
# Development networks with native L2 deposits (escrow inbox).
devnet-l2-deposits = ["bloch-pos-committee/devnet-l2-deposits", "bloch-pos-node/devnet-l2-deposits"]
# Development networks admitting settlement V3 user transactions and their L1
# data-availability transactions (0x15); a follower without it halts on them.
devnet-l2-user-txs = ["devnet-l2-deposits", "bloch-pos-committee/devnet-l2-user-txs", "bloch-pos-node/devnet-l2-user-txs"]
# Development networks with forward-secure (KES) validator keys: registrations
# (0x17) and, from the compiled activation epoch, KES-signed proposals and votes.
# A follower must replay with exactly the validators' schedule.
# devnet-kes = ["bloch-pos-committee/devnet-kes", "bloch-pos-node/devnet-kes"]
# Development networks with the light-client roster (state component 0x23)
# from the compiled activation epoch: the follower's state roots must include it.
# devnet-lc-roster = ["bloch-pos-committee/devnet-lc-roster", "bloch-pos-node/devnet-lc-roster"]
# QUALIFICATION BUILDS ONLY (private mainnet-path rehearsal): replay a private
# L1 built with the native `l2-activation-rehearsal-mainnet-policy` feature and
# the same BLOCH_L2_REHEARSAL_ACTIVATION_EPOCH (mainnet policy values, the
# private network's identities 0..1). Never for a funded network.
l2-activation-rehearsal-mainnet-policy = ["bloch-pos-committee/l2-activation-rehearsal-mainnet-policy", "bloch-pos-node/l2-activation-rehearsal-mainnet-policy"]

[dependencies]
bloch-l2-evm = { path = "../.." }
bloch-native-escrow-pq = { path = "../native-escrow-pq" }
bloch-reth-execution = { path = "../reth-execution" }
bloch-l2-proof = { path = "../../../bloch-validator-payout/crates/bloch-l2-proof" }
bloch-crypto = { path = "../../../bloch-validator-payout/crates/bloch-crypto", default-features = false }
bloch-pos-committee = { path = "../../../bloch-validator-payout/crates/bloch-pos-committee" }
bloch-pos-node = { path = "../../../bloch-validator-payout/crates/bloch-pos-node" }
serde_json = "1.0"
sha3 = { version = "0.10", default-features = false }
libc = "0.2"
# sign-tx / address (development keys only); the same pins as the dev-dependencies.
alloy-consensus = { version = "=2.2.0", default-features = false, features = ["k256"] }
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa"] }
alloy-primitives = { version = "=1.6.1", default-features = false }
reth-db-api = { path = "../../../reth-bloch-rpc-snapshot/crates/storage/db-api" }
reth-provider = { path = "../../../reth-bloch-rpc-snapshot/crates/storage/provider" }
reth-db = { path = "../../../reth-bloch-rpc-snapshot/crates/storage/db" }
reth-tasks = { path = "../../../reth-bloch-rpc-snapshot/crates/tasks" }

[patch.crates-io]
pqcrypto-internals = { path = "../../../bloch-validator-payout/crates/pqcrypto-internals" }

[dev-dependencies]
bloch-execution-artifact = { path = "../execution-artifact" }
alloy-consensus = { version = "=2.2.0", default-features = false, features = ["k256"] }
alloy-rlp = "=0.3.16"
hex = "0.4"
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa"] }
reth-chainspec = { path = "../../../reth-bloch-rpc-snapshot/crates/chainspec" }
reth-provider = { path = "../../../reth-bloch-rpc-snapshot/crates/storage/provider", features = ["test-utils"] }
reth-db = { path = "../../../reth-bloch-rpc-snapshot/crates/storage/db", features = ["test-utils"] }
reth-tasks = { path = "../../../reth-bloch-rpc-snapshot/crates/tasks", features = ["test-utils"] }
tempfile = "3"
