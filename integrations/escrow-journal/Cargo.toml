[package]
name = "bloch-escrow-journal"
version = "0.1.0-experimental"
edition = "2021"
rust-version = "1.94.1"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[dependencies]
bloch-l2-evm = { path = "../..", features = ["serde", "experimental-escrow"] }
alloy-primitives = { version = "=1.6.1", default-features = false, features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.151"
