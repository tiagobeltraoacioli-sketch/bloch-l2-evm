[package]
name = "bloch-evm-sp1-host"
version = "0.1.0-experimental"
edition = "2021"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
publish = false
default-run = "bloch-evm-sp1-host"

[workspace]

[features]
default = []
source-settlement = ["dep:bloch-native-domain-devnet", "dep:sha3"]
node-artifact = ["dep:bloch-execution-artifact"]

[[bin]]
name = "bloch-evm-sp1-artifact"
path = "src/bin/bloch-evm-sp1-artifact.rs"
required-features = ["node-artifact"]

[[bin]]
name = "bloch-evm-sp1-chain"
path = "src/bin/bloch-evm-sp1-chain.rs"
required-features = ["node-artifact"]

[dependencies]
bloch-execution-artifact = { path = "../../execution-artifact", optional = true }
bloch-native-domain-devnet = { path = "../../native-domain-devnet", optional = true }
libc = "=0.2.189"
sha3 = { version = "=0.11.0", default-features = false, optional = true }
bloch-l2-evm = { path = "../../..", features = ["serde"] }
alloy-consensus = { version = "=2.2.0", default-features = false, features = ["k256"] }
alloy-eips = { version = "=2.2.0", default-features = false }
alloy-primitives = { version = "=1.6.1", default-features = false }
alloy-rlp = { version = "=0.3.16", default-features = false }
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa"] }
sp1-sdk = { version = "=6.8.0", default-features = false }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros"] }
bincode = "=1.3.3"
