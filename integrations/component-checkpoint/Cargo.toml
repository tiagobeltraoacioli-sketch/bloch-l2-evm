[package]
name = "bloch-component-checkpoint"
version = "0.1.0"
edition = "2021"
rust-version = "1.94.1"
license = "AGPL-3.0-or-later"
publish = false

[workspace]

[dependencies]
bloch-crypto = { path = "../../../bloch-validator-payout/crates/bloch-crypto", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.151"
sha3 = "=0.11.0"
hex = "0.4"
zeroize = "1"

[patch.crates-io]
pqcrypto-internals = { path = "../../../bloch-validator-payout/crates/pqcrypto-internals" }
