[package]
name = "bloch-reth-execution"
version = "0.1.0-experimental"
edition = "2021"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[dependencies]
alloy-consensus = { version = "=2.2.0", default-features = false, features = ["k256"] }
alloy-eips = { version = "=2.2.0", default-features = false }
alloy-evm = "=0.37.1"
bloch-l2-evm = { path = "../.." }
alloy-primitives = { version = "=1.6.1", default-features = false }
alloy-rlp = "=0.3.16"
reth-primitives-traits = { version = "=0.5.2", features = ["serde", "reth-codec"] }
reth-codecs = "=0.5.2"
serde = "1.0"
alloy-genesis = "=2.1.1"
alloy-rpc-types-engine = "=2.1.1"
# Development checkout: verify the exact revision recorded in README.md.
reth-revm = { path = "../../../reth-bloch-integration/crates/revm" }
reth-evm = { path = "../../../reth-bloch-integration/crates/evm/evm" }
reth-db-api = { path = "../../../reth-bloch-integration/crates/storage/db-api" }
reth-storage-api = { path = "../../../reth-bloch-integration/crates/storage/storage-api", features = ["db-api"] }
reth-storage-errors = { path = "../../../reth-bloch-integration/crates/storage/errors" }
reth-provider = { path = "../../../reth-bloch-integration/crates/storage/provider" }
reth-chainspec = { path = "../../../reth-bloch-integration/crates/chainspec" }
reth-network-peers = { path = "../../../reth-bloch-integration/crates/net/peers" }
reth-payload-primitives = { path = "../../../reth-bloch-integration/crates/payload/primitives" }
reth-node-types = { path = "../../../reth-bloch-integration/crates/node/types" }
reth-chain-state = { path = "../../../reth-bloch-integration/crates/chain-state" }
reth-execution-types = { path = "../../../reth-bloch-integration/crates/evm/execution-types" }
reth-trie-common = { path = "../../../reth-bloch-integration/crates/trie/common" }

[dev-dependencies]
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa"] }
serde_json = "1.0"
tempfile = "3"
reth-prune-types = { path = "../../../reth-bloch-integration/crates/prune/types" }
reth-provider = { path = "../../../reth-bloch-integration/crates/storage/provider", features = ["test-utils"] }
reth-db = { path = "../../../reth-bloch-integration/crates/storage/db", features = ["test-utils"] }
reth-tasks = { path = "../../../reth-bloch-integration/crates/tasks", features = ["test-utils"] }
