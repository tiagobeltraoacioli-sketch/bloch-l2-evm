# CI for bloch-l2-evm (SCAFFOLD). Every job runs with the committed lockfile
# (`--locked`) and the pinned toolchain (rust-toolchain.toml): a build that
# needs a different dependency resolution or compiler is a program change and
# must be reviewed as one (audit findings C30, C31, I10).
name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · test (std, serde, no_std) · doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo build --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --features serde
      - name: Test the fail-closed network identity decision
        run: python3 tools/test-network-identity.py
      - name: Test the fail-closed L2 finality permission gate
        run: python3 tools/test-finality-readiness.py
      - name: Test bounded finalized RPC capture and offline replay
        run: python3 tools/test-finalized-rpc.py
      - name: Test the fail-closed production-node bind gate
        run: python3 tools/test-node-production.py
      - name: Test the fail-closed L2 node provisioning preflight
        run: python3 tools/test-node-provisioning.py
      - name: Test the blocked production-node build request
        run: python3 tools/run-audited-evidence-step.py production-node-build-request
      - name: Test the production entrypoint capability contract
        run: python3 tools/test-production-entrypoint-contract.py
      - name: Test synthetic production-entrypoint conformance isolation
        run: python3 tools/test-production-entrypoint-conformance.py
      - name: Test workspace production-node gap report
        run: python3 tools/test-workspace-production-node-gap.py
      - name: Test non-authorizing partial implementation evidence
        run: python3 tools/run-audited-evidence-step.py partial-implementation-evidence
      - name: Test frozen-genesis admission and offline ceremony
        run: node --test tools/test-frozen-genesis-admission.mjs tools/test-frozen-genesis-ceremony.mjs
      - name: Compile the non-authorizing production entrypoint API
        run: cargo test --locked --manifest-path integrations/production-entrypoint-api/Cargo.toml
      - name: Test source-bound production-node qualification packages
        run: python3 tools/run-audited-evidence-step.py node-qualification-package
      - name: Test authenticated operational evidence intake
        run: python3 tools/test-operational-evidence-intake.py
      - name: Run the signed developer contract lifecycle
        run: cargo run --locked --example developer_contract
      - name: Rehearse durable signed contract execution and recovery
        run: python3 tools/developer-rehearsal.py "$RUNNER_TEMP/bloch-developer-rehearsal"
      - name: Test durable journal recovery and publication failures
        run: cargo test --locked --manifest-path integrations/escrow-journal/Cargo.toml
      - run: cargo build --locked --no-default-features
      - run: cargo test --locked --no-default-features
      # Capacity and overflow guards must also hold with release optimizations.
      - run: cargo test --locked --release --test deep_security --test signed_transactions
      - run: cargo doc --locked --no-deps
      # List the pre-existing ignored performance benchmark for discoverability.
      - run: cargo test --locked --test audit_regressions -- --ignored --list

  operator-tests:
    name: Launch kit, monitor and gateway regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check launch configuration, source pins and monitor state
        run: python3 -m unittest discover -s deployment/mainnet -p 'test_*.py'
      - name: Check gateway rendering and local transport failures
        run: python3 -m unittest discover -s deployment/mainnet/public-rpc/tests -p 'test_*.py'
      - name: Check gateway EVM budgets and transaction admission responses
        run: node --test deployment/mainnet/public-rpc/tests/*.test.mjs deployment/mainnet/public-rpc/tests/review_r10_gateway.mjs

  reth-provider:
    name: Reth provider execution and storage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bloch-modular-execution
    steps:
      - uses: actions/checkout@v4
        with:
          path: bloch-modular-execution
      - uses: actions/checkout@v4
        with:
          repository: paradigmxyz/reth
          ref: 8eb210175687c9f0c889a3b6795c16781d830e3a
          path: reth-bloch-integration
      - name: Install the separate pinned host toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
      - name: Install native storage build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bloch-modular-execution/integrations/reth-execution
      - run: cargo +1.98.1 fmt --manifest-path integrations/reth-execution/Cargo.toml -- --check
      - run: cargo +1.98.1 test --locked --manifest-path integrations/reth-execution/Cargo.toml
      - run: cargo +1.98.1 clippy --locked --manifest-path integrations/reth-execution/Cargo.toml --all-targets -- -D warnings

  wallets:
    name: EIP-1193 wallet adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test wallets/bloch-l2.test.mjs

  deny:
    name: cargo deny (bans · sources · advisories · licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans sources advisories licenses
          arguments: --all-features

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Prebuilt binary: building cargo-audit from source under the repo's
      # pinned toolchain fails on its own MSRV, and `cargo audit` only reads
      # Cargo.lock (+ .cargo/audit.toml), so the toolchain is irrelevant here.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
