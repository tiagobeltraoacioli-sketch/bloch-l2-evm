# CI for bloch-l2-evm (SCAFFOLD). Every job runs with the committed lockfile
# (`--locked`) and the pinned toolchain (rust-toolchain.toml): a build that
# needs a different dependency resolution or compiler is a program change and
# must be reviewed as one (audit findings C30, C31, I10).
name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · test (std, serde, no_std) · doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo build --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --features serde
      - run: cargo build --locked --no-default-features
      - run: cargo test --locked --no-default-features
      - run: cargo doc --locked --no-deps
      # Open audit findings and benchmarks are `#[ignore]`d and EXPECTED to
      # fail; they are listed, never gated on:
      - run: cargo test --locked --test audit_regressions -- --ignored --list

  deny:
    name: cargo deny (bans · sources · advisories · licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans sources advisories licenses
          arguments: --all-features

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
